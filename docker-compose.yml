services:
  # HTTP mode (Streamable HTTP) on 127.0.0.1:8765/mcp, built from this repo.
  #
  # The endpoint has NO authentication of its own: anyone who can reach it
  # can query the tenant in .env. The port is published on localhost only;
  # put an authenticating proxy in front before exposing it further.
  #
  #   docker compose up -d --build
  eset-mcp-http:
    build: .
    container_name: eset-mcp-http
    restart: unless-stopped
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: http
      ESET_MCP_HTTP_HOST: 0.0.0.0   # inside the container; published on localhost below
      ESET_MCP_HTTP_PORT: "8765"
    ports:
      - "127.0.0.1:8765:8765"

  # stdio one-shot (Claude Desktop / Claude Code launching it via docker):
  #   docker compose run --rm eset-mcp-stdio
  eset-mcp-stdio:
    build: .
    profiles: ["stdio"]
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: stdio
    stdin_open: true
    tty: false
