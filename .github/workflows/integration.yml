name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily run at 03:17 UTC — catches drift between the bundled OpenAPI
    # specs and ESET's published Swagger (e.g. a new v3 endpoint).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install (locked)
        run: uv sync --locked --extra dev --python 3.13

      - name: Lint
        run: uv run ruff check eset_mcp tests scripts

      - name: Run tests
        # Offline tests always run. Integration tests run only when the
        # ESET_USER / ESET_PASSWORD secrets are set (read-only API user).
        env:
          ESET_USER: ${{ secrets.ESET_USER }}
          ESET_PASSWORD: ${{ secrets.ESET_PASSWORD }}
          ESET_REGION: ${{ secrets.ESET_REGION || 'eu' }}
        run: uv run pytest -v

      - name: Check ESET spec drift
        run: uv run python scripts/update_specs.py --check
